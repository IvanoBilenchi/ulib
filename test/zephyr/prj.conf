# uLib's own settings are CMake options, set by this application's CMakeLists.

# The suite peaks at 16 concurrent workers, in the lock tests.
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=20
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=32768

# uLib allocates through the C library, whose arena is empty by default.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=524288

# USLock spins without entering the kernel, so a preempted holder is only rescheduled
# by the timeslicer. Without this, equal priority spinners livelock on a single CPU.
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=1

# ulog and the stream tests format floating point values, which picolibc omits by default.
CONFIG_PICOLIBC_IO_FLOAT=y
