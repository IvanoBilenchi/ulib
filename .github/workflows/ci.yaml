name: CI pipeline

on:
  push:
    branches:
      - dev
      - 'dev-*'

defaults:
  run:
    shell: bash

env:
  config: Debug
  llvm: 23

jobs:
  analyze:
    name: "Analyze (types: ${{matrix.types}}, concurrency: ${{matrix.concurrency}})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        types: [NORMAL, TINY, HUGE]
        concurrency: [OFF]
        include:
          - types: NORMAL
            concurrency: ON
    steps:
      - name: Install LLVM
        run: |
          dist=$(lsb_release -cs)
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb https://apt.llvm.org/${dist}/ llvm-toolchain-${dist}-${{env.llvm}} main" |
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-${{env.llvm}} clang-tidy-${{env.llvm}}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Pre-commit
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pre-commit
          pre-commit run --from-ref=HEAD~1 --to-ref=HEAD

      - name: Configure
        run: >
          cmake --preset ci-analyze
          -DCMAKE_C_COMPILER=clang-${{env.llvm}}
          -DCMAKE_CXX_COMPILER=clang++-${{env.llvm}}
          -DCLANG_TIDY_EXECUTABLE=clang-tidy-${{env.llvm}}
          -DULIB_TYPES=${{matrix.types}}
          -DULIB_CONCURRENCY=${{matrix.concurrency}}

      - name: Build
        run: cmake --build --preset build

  test:
    name: "Test (os: ${{matrix.os}}, variant: ${{matrix.variant}})"
    runs-on: ${{matrix.os}}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        variant: [normal, tiny, huge, concurrency, platform-sync, pthread-park, strict-iso,
                  shared-tsan, cpp]
        exclude:
          - os: windows
            variant: pthread-park
          - os: windows
            variant: strict-iso
        include:
          - lib_type: STATIC
            types: NORMAL
            concurrency: OFF
            platform_sync: OFF
            native_futex: ON
            sanitizers: address;undefined
            cpp: OFF
            c_extensions: ON
          - variant: tiny
            types: TINY
          - variant: huge
            types: HUGE
          - variant: concurrency
            concurrency: ON
          - variant: platform-sync
            concurrency: ON
            platform_sync: ON
          - variant: pthread-park
            concurrency: ON
            native_futex: OFF
          - variant: strict-iso
            concurrency: ON
            c_extensions: OFF
          - variant: shared-tsan
            lib_type: SHARED
            concurrency: ON
            sanitizers: thread
          - variant: cpp
            concurrency: ON
            cpp: ON
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake --preset ci-test
          -DCMAKE_BUILD_TYPE=${{env.config}}
          -DULIB_LIBRARY_TYPE=${{matrix.lib_type}}
          -DULIB_TYPES=${{matrix.types}}
          -DULIB_CONCURRENCY=${{matrix.concurrency}}
          -DULIB_PLATFORM_SYNC=${{matrix.platform_sync}}
          -DULIB_NATIVE_FUTEX=${{matrix.native_futex}}
          -DULIB_SANITIZERS="${{matrix.sanitizers}}"
          -DULIB_CPP_TESTS=${{matrix.cpp}}
          -DCMAKE_C_EXTENSIONS=${{matrix.c_extensions}}

      - name: Build
        run: cmake --build --preset build --config ${{env.config}}

      - name: Prepare workdir (Windows)
        working-directory: build
        if: runner.os == 'Windows'
        run: |
          if [ ${{matrix.lib_type}} == 'SHARED' ]; then
            for exe_dir in test bench; do
              cp ${{env.config}}/*.dll ${exe_dir}/${{env.config}}
            done
          fi

      - name: Run
        run: ctest --preset test --build-config ${{env.config}}

  zephyr:
    name: "Test (os: zephyr)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: ulib

      - name: Install 32 bit host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ulib
          toolchains: x86_64-zephyr-elf

      - name: Run
        working-directory: ulib
        run: west twister -T test/zephyr --inline-logs

  bench:
    name: "Benchmark (os: ${{matrix.os}})"
    runs-on: ${{matrix.os}}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -B build --preset bench -DCMAKE_BUILD_TYPE=${{env.config}}

      - name: Build
        run: cmake --build --preset build --config ${{env.config}}

      - name: Run
        run: ctest --preset bench --build-config ${{env.config}}

  docs:
    name: Documentation
    runs-on: ubuntu-26.04 # Revert to ubuntu-latest when it is updated to 26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt install doxygen
          python -m venv .venv
          source .venv/bin/activate
          pip install Sphinx sphinx-rtd-theme breathe

      - name: Build
        run: |
          source .venv/bin/activate
          cmake --preset docs
          cmake --build --preset docs
