name: CI pipeline

on:
  push:
    branches:
      - dev
      - 'dev-*'

defaults:
  run:
    shell: bash

env:
  config: Release

jobs:
  analyze:
    name: Analyze
    runs-on: ${{vars.ubuntu_runner || 'ubuntu-latest'}}
    strategy:
      fail-fast: false
      matrix:
        types: [normal, tiny, huge]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Pre-commit
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pre-commit
          pre-commit run --from-ref=HEAD~1 --to-ref=HEAD

      - name: Configure
        run: >
          CC=clang cmake -B build
          -DULIB_CPP_TESTS=OFF
          -DULIB_TINY=${{matrix.types == 'tiny' && 'ON' || 'OFF'}}
          -DULIB_HUGE=${{matrix.types == 'huge' && 'ON' || 'OFF'}}
          -DULIB_LTO=OFF
          -DULIB_CLANG_TIDY=ON
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_LINK_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

  test:
    name: Test
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ${{vars.ubuntu_runner || 'ubuntu-latest'}}
          - ${{vars.windows_runner || 'windows-latest'}}
          - ${{vars.macos_runner || 'macos-latest'}}
        lib_type: [STATIC, SHARED]
        types: [normal, tiny, huge]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -B build
          -DULIB_LIBRARY_TYPE=${{matrix.lib_type}}
          -DULIB_TINY=${{matrix.types == 'tiny' && 'ON' || 'OFF'}}
          -DULIB_HUGE=${{matrix.types == 'huge' && 'ON' || 'OFF'}}
          -DULIB_LEAKS=ON
          -DULIB_SANITIZERS=ON
          -DCMAKE_SYSTEM_VERSION=''
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_LINK_WARNING_AS_ERROR=ON
          -DCMAKE_BUILD_TYPE=${{env.config}}
          -DCMAKE_C_FLAGS='-DULIB_ASSERT=1'

      - name: Build
        run: cmake --build build --config ${{env.config}}

      - name: Prepare workdir (Windows)
        working-directory: build
        if: runner.os == 'Windows'
        run: |
          if [ ${{matrix.lib_type}} == 'SHARED' ]; then
            for exe_dir in test bench; do
              cp ${{env.config}}/*.dll ${exe_dir}/${{env.config}}
            done
          fi

      - name: Run
        working-directory: build
        run: ctest --build-config ${{env.config}} --output-on-failure

  bench:
    name: Benchmark
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ${{vars.ubuntu_runner || 'ubuntu-latest'}}
          - ${{vars.windows_runner || 'windows-latest'}}
          - ${{vars.macos_runner || 'macos-latest'}}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -B build
          -DULIB_LTO=ON
          -DULIB_OPTIMIZE_FOR_HOST=ON
          -DCMAKE_SYSTEM_VERSION=''
          -DCMAKE_BUILD_TYPE=${{env.config}}

      - name: Build
        run: cmake --build build --config ${{env.config}} --target ulib-bench

      - name: Prepare workdir (Windows)
        working-directory: build/bench
        if: runner.os == 'Windows'
        run: mv ${{env.config}}/*.exe ./

      - name: Run
        working-directory: build/bench
        run: ./ulib-bench

  docs:
    name: Documentation
    runs-on: ${{vars.ubuntu_runner || 'ubuntu-latest'}}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt install doxygen
          python -m venv .venv
          source .venv/bin/activate
          pip install Sphinx sphinx-rtd-theme breathe

      - name: Build
        run: |
          source .venv/bin/activate
          cmake -B build -DULIB_DOCS=ON
          cmake --build build --target ulib-docs
